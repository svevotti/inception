name: smazzari-inception
services:
  nginx-reverse-proxy:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: ng
    image:  nginx-reverse-proxy:1.0
    secrets:
      - my_cert
      - my_key
    volumes:
      - wp_files:/var/www/html
    ports:
      # - "8080:80"
      - "443:443"
    networks:
      - my_network
    restart: always
    depends_on:
      - wordpress-website
  mariadb-database:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    secrets:
      - db_password
    environment:
      - MYSQL_DATABASE=${DATABASE}
      - MYSQL_USER=${USER_DB}
      - MYSQL_PASSWORD=/run/secrets/db_password
    container_name: db
    image: mariadb-database:1.0
    networks:
      - my_network
    ports:
      - 3306:3306
    volumes:
      - wordpress_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "/root/healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  wordpress-website:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wp
    image: wordpress-website:1.0
    secrets:
      - db_password
      - admin_password
    environment:
      - WORDPRESS_DB_NAME=${DATABASE}
      - WORDPRESS_DB_USER=${USER_DB}
      - WORDPRESS_DB_PASSWORD_FILE=/run/secrets/db_password
      - WORDPRESS_DB_HOST=${HOST}
      - DOMAIN=${DOMAIN}
      - PORT=${PORT}
      - TITLE=${TITLE}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
    networks:
      - my_network
    ports:
      - 9000:9000
    volumes:
      - wp_files:/var/www/html
    depends_on:
      mariadb-database:
        condition: service_healthy
    # extra_hosts:
    #   - "smazzari.42.fr:172.18.0.1"
    restart: always

volumes:
  wp_files:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '~/data/wp_files'
  wordpress_db:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '~/data/wp_database'
networks:
  my_network:
secrets:
  db_password:
    file: ../secrets/db_password.txt
  admin_password:
    file: ../secrets/admin_password.txt
  my_cert:
    file: ../secrets/ssl/smazzari.42.fr.crt
  my_key:
    file: ../secrets/ssl/smazzari.42.fr.key