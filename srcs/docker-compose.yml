services:
  nginx:
    image: my_nginx:1.0
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: ng
    secrets:
      - my_cert
      - my_key
    volumes:
    - wp_files:/var/www/html
    ports:
      - "443:443"
    networks:
      - my_network
    restart: always
    depends_on:
      - wordpress
  mariadb:
    image: my_mariadb:1.0
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    secrets:
      - db_password
    environment:
      - MYSQL_DATABASE=${DATABASE}
      - MYSQL_USER=${USER_DB}
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
    container_name: db
    networks:
      - my_network
    ports:
      - 3306:3306
    volumes:
      - wordpress_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "/root/healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
  
  wordpress:
    image: my_wordpress:1.0
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wp
    secrets:
      - db_password
      - admin_password
      - user_password
    environment:
      - WORDPRESS_DB_NAME=${DATABASE}
      - WORDPRESS_DB_USER=${USER_DB}
      - WORDPRESS_DB_PASSWORD_FILE=/run/secrets/db_password
      - WORDPRESS_DB_HOST=${HOST}
      - DOMAIN=${DOMAIN}
      - PORT=${PORT}
      - TITLE=${TITLE}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - USER_ROLE=${USER_ROLE}
      - USER_PASSWORD_FILE=/run/secrets/user_password
    networks:
      - my_network
    ports:
      - 9000:9000
    volumes:
      - wp_files:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    restart: always

volumes:
  wp_files:
  wordpress_db:
networks:
  my_network:
secrets:
  db_password:
    file: ../secrets/db_password.txt
  admin_password:
    file: ../secrets/admin_password.txt
  user_password:
    file: ../secrets/user_password.txt
  my_cert:
    file: ../secrets/ssl/smazzari.42.fr.crt
  my_key:
    file: ../secrets/ssl/smazzari.42.fr.key
