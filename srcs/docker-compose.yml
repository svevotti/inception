services:
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: ng
    volumes:
      - wp_files:/var/www/html/
    ports:
      - "8080:80"
    networks:
      - my_network
    restart: always
    depends_on:
      - wordpress
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    environment:
      MYSQL_DATABASE: "my_data"
      MYSQL_USER: "svevish"
      MYSQL_PASSWORD: "3"
    container_name: db
    networks:
      - my_network
    ports:
      - 3306:3306
    volumes:
      - wordpress_db:/var/lib/mysql
    restart: always
  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wp
    environment:
      WORDPRESS_DB_HOST: "db"
      WORDPRESS_DB_USER: "svevish"
      WORDPRESS_DB_PASSWORD: "3"
      WORDPRESS_DB_NAME: "my_data"
    networks:
      - my_network
    ports:
      - 9000:9000
    volumes:
      - wp_files:/var/www/html/
    depends_on:
      - mariadb
    restart: always

volumes:
  wp_files:
  wordpress_db:
networks:
  my_network:
    external: true
    name: net